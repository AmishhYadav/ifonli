name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Why several jobs and two e2e modes:
#  - `next build` prerenders product/vibe/type pages FROM THE DATABASE (as Vercel does against the
#    production DB), so every job that builds needs a migrated + seeded Postgres service.
#  - The dev payment mock refuses to run under NODE_ENV=production (by design), so the functional e2e
#    suite (checkout, prepaid payments) runs against `next dev`; the security/CSP spec and Lighthouse
#    run against `next start` on the production build, which is what ships.

env:
  CI: true
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------------------------------------
  # Fast checks: no database needed.
  # ---------------------------------------------------------------------------------------------
  static:
    name: Lint, types, unit, contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Migration history consistency
        # Catches a hand-edited or conflicting drizzle/meta journal without needing a database.
        run: pnpm exec drizzle-kit check
      - name: Contrast check
        run: pnpm contrast

  # ---------------------------------------------------------------------------------------------
  # Integration tests against a real Postgres 16 (migrations run from scratch every time).
  # ---------------------------------------------------------------------------------------------
  integration:
    name: Integration tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # pg_trgm / unaccent are created by the migrations; the official image ships contrib.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BETTER_AUTH_SECRET: ci-dummy-secret-not-for-production-use-00000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ORDER_TOKEN_SECRET: ci-order-token-secret-00000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests
        run: pnpm test:integration

  # ---------------------------------------------------------------------------------------------
  # Functional e2e (chromium-desktop) against `pnpm dev` on the seeded service database.
  # ---------------------------------------------------------------------------------------------
  e2e-dev:
    name: e2e (functional, next dev)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BETTER_AUTH_SECRET: ci-dummy-secret-not-for-production-use-00000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ORDER_TOKEN_SECRET: ci-order-token-secret-00000000000000000000
      CRON_SECRET: ci-cron-secret
      SEED_OWNER_EMAIL: owner@ifonli.local
      # The payment mock only exists outside production builds, so the prepaid specs need `next dev`.
      E2E_MOCK_CHECKOUT: "1"
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed-products
          pnpm db:seed-content
          pnpm db:import-reference
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start dev server and warm up key routes
        run: |
          nohup pnpm dev > dev-server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:3000/api/health && break
            sleep 2
          done
          # First hit of a route compiles it under `next dev`; do that before the timed tests.
          for path in / /home /shop /products/heart-charm /vibes/cute /vibes/funky /vibes/bold /vibes/gothic /types/charms /types/hippers /types/3d-stickers /types/diy-accessories /cart /checkout /track /help /search /wishlist /account/login /admin/login /policies/shipping /policies/returns-refunds; do
            curl -sS -o /dev/null -m 120 "http://localhost:3000${path}" || true
          done
      - name: Playwright (chromium-desktop)
        run: pnpm e2e --project=chromium-desktop
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dev
          path: |
            playwright-report/
            test-results/
            dev-server.log
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Production build: build against the migrated + seeded DB, then verify what ships:
  # security headers / CSP in a real browser, the production-only vibe timing and font tests, and
  # Lighthouse budgets (non-blocking for now).
  # ---------------------------------------------------------------------------------------------
  prod:
    name: Build, security e2e, vibe timing, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BETTER_AUTH_SECRET: ci-dummy-secret-not-for-production-use-00000000
      BETTER_AUTH_URL: http://localhost:3107
      NEXT_PUBLIC_SITE_URL: http://localhost:3107
      ORDER_TOKEN_SECRET: ci-order-token-secret-00000000000000000000
      # A production server refuses to boot without these (src/lib/env.ts, assertProductionEnv):
      # secrets of 32+ characters and the e-mail and payment settings. Dummy values: nothing in this
      # job sends mail or takes payment.
      CRON_SECRET: ci-cron-secret-not-for-production-0000000
      RESEND_API_KEY: re_ci_dummy_key
      EMAIL_FROM: IfOnli CI <ci@ifonli.local>
      RAZORPAY_KEY_ID: rzp_test_ci_dummy
      RAZORPAY_KEY_SECRET: ci-razorpay-key-secret
      RAZORPAY_WEBHOOK_SECRET: ci-razorpay-webhook-secret
      SEED_OWNER_EMAIL: owner@ifonli.local
      # CSP_MODE is read at BUILD time (next.config headers); CI verifies the enforced policy.
      CSP_MODE: enforce
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed-products
          pnpm db:seed-content
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        run: |
          nohup pnpm start -p 3107 > prod-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3107/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3107/api/health
      - name: Security headers / CSP e2e (production build)
        run: pnpm e2e --project=chromium-desktop --grep "security:"
        env:
          E2E_BASE_URL: http://localhost:3107
          E2E_ADMIN_FLOW: "1"
      # vibe.spec (h) switch timing and (i) font requests are about what ships, so they are skipped under
      # `next dev` (E2E_PROD unset) and run here. The spec drives the /dev/vibe playground and reads
      # the vibe events, which exist only in a build made with NEXT_PUBLIC_ENABLE_DEV_PAGES=1, so this
      # step makes a second build of that kind (own dist dir) and leaves the build above untouched.
      - name: Build with dev pages (vibe timing and font tests)
        run: NEXT_DIST_DIR=.next-perf NEXT_PUBLIC_ENABLE_DEV_PAGES=1 pnpm build
      - name: Start dev-pages production server
        run: |
          NEXT_DIST_DIR=.next-perf nohup pnpm exec next start -p 3108 > perf-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3108/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3108/api/health
      - name: Vibe switch timing and font requests (production build)
        run: pnpm e2e --project=chromium-desktop vibe.spec.ts --grep "\\(h\\)|\\(i\\)"
        env:
          E2E_BASE_URL: http://localhost:3108
          E2E_PROD: "1"
      # The main build keeps the launch gate on (placeholder settings), so its checkout shows the
      # "not taking orders" notice. The review build has the gate off: check the real checkout form
      # under the enforced CSP there.
      - name: Checkout form CSP (production build, launch gate off)
        run: pnpm e2e --project=chromium-desktop security-headers.spec.ts --grep "add to cart, cart page and checkout"
        env:
          E2E_BASE_URL: http://localhost:3108
          E2E_EXPECT_CHECKOUT_FORM: "1"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: |
            playwright-report/
            test-results/
            prod-server.log
            perf-server.log
          retention-days: 7
      # Lighthouse starts its own server (lighthouserc.json); stop ours first.
      - name: Stop production server
        if: always()
        run: pkill -f "next start" || true
      # NOT GATING YET, on purpose (continue-on-error): on the shared CI runner the home page scores
      # 0.57-0.77 for performance against the 0.85 budget, and the numbers swing from run to run. The
      # reports are uploaded below so the trend can be read; remove continue-on-error (and tune the
      # budgets to a runner-realistic baseline) once there is a stable run of green results.
      - name: Lighthouse CI (mobile budgets, plan 13)
        continue-on-error: true
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.json
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          # lighthouserc.json writes here (a visible folder: upload-artifact skips dot-folders by default).
          path: lhci-results/
          if-no-files-found: warn
          retention-days: 7
